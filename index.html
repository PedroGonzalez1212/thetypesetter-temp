<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ===== SEO ===== -->
  <title>The Typesetter | Making Global Communication Easy</title>
  <meta name="description" content="Translation, localization, desktop publishing, video localization and digital accessibility for agencies and companies worldwide. 20+ years. ISO 17100 & ISO 9001 certified.">
  <link rel="canonical" href="https://www.thetypesetter.com.ar/">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#ffffff">

  <!-- Open Graph / LinkedIn / WhatsApp previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Typesetter">
  <meta property="og:url" content="https://www.thetypesetter.com.ar/">
  <meta property="og:title" content="The Typesetter | Making Global Communication Easy">
  <meta property="og:description" content="Any Language | Every Format | All Tools | One Team. Our new website is on its way.">
  <meta property="og:image" content="https://www.thetypesetter.com.ar/assets/video/tts-intro-poster.jpg">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Structured data: lets Google understand who the company is -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "The Typesetter",
    "url": "https://www.thetypesetter.com.ar/",
    "logo": "https://www.thetypesetter.com.ar/assets/img/logo-tts.png",
    "slogan": "Making Global Communication Easy",
    "description": "Translation, localization, desktop publishing, video localization and digital accessibility services for agencies and companies worldwide.",
    "email": "clientsuccessteam@thetypesetter.com.ar",
    "sameAs": ["https://www.linkedin.com/company/the-typesetter/"],
    "address": [
      {
        "@type": "PostalAddress",
        "streetAddress": "Nazaret 2887, Piso 3, Oficina 22",
        "addressLocality": "Córdoba",
        "addressCountry": "AR"
      },
      {
        "@type": "PostalAddress",
        "streetAddress": "255 Aragon Avenue, 2nd Floor",
        "addressLocality": "Coral Gables",
        "addressRegion": "FL",
        "postalCode": "33134",
        "addressCountry": "US"
      }
    ],
    "contactPoint": [
      { "@type": "ContactPoint", "telephone": "+1-904-807-4554", "contactType": "customer service", "areaServed": "US" },
      { "@type": "ContactPoint", "telephone": "+54-351-489-0206", "contactType": "customer service", "areaServed": "AR" }
    ]
  }
  </script>

  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="is-intro">

  <!-- ============ 1. INTRO: full-screen video ============ -->
  <section class="intro" id="intro" aria-label="The Typesetter rebranding video">
    <video
      id="introVideo"
      class="intro__video"
      muted
      playsinline
      preload="auto"
      poster="assets/video/tts-intro-poster.jpg"
      data-src-desktop="assets/video/tts-intro-1080.mp4"
      data-src-mobile="assets/video/tts-intro-720.mp4"
      data-src-webm="assets/video/tts-intro-1080.webm">
    </video>

    <div class="intro__controls">
      <button class="btn-ghost" id="soundBtn" type="button" aria-pressed="false">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="icon icon--off"><path d="M4 9v6h4l5 4V5L8 9H4zm12.6 3 2.7-2.7-1.1-1.1-2.7 2.7-2.7-2.7-1.1 1.1 2.7 2.7-2.7 2.7 1.1 1.1 2.7-2.7 2.7 2.7 1.1-1.1-2.7-2.7z"/></svg>
        <svg aria-hidden="true" viewBox="0 0 24 24" class="icon icon--on"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM13 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <span id="soundLabel">Sound on</span>
      </button>
    </div>

    <div class="intro__progress" aria-hidden="true"><span id="progressBar"></span></div>
  </section>

  <!-- ============ 2. COMING SOON ============ -->
  <main class="soon" id="soon" aria-hidden="true">
    <div class="soon__top" aria-hidden="true"></div>

    <div class="soon__content">
      <img class="soon__logo" src="assets/img/logo-tts.png" width="810" height="728" alt="The Typesetter">

      <p class="soon__eyebrow">Our new website is under construction</p>
      <h1 class="soon__title">We’re building <strong>something new</strong>.</h1>
      <p class="soon__text">After 20 years making global communication easy, our identity evolves. Same essence, new ways forward.</p>

      <!-- items grouped in pairs so the row breaks 4 or 2+2, never 3+1 -->
      <div class="soon__pillars" role="list" aria-label="Positioning">
        <div class="soon__pair">
          <span role="listitem" class="c-green">Any Language</span>
          <span role="listitem" class="c-pink">Every Format</span>
        </div>
        <div class="soon__pair">
          <span role="listitem" class="c-blue">All Tools</span>
          <span role="listitem" class="c-orange">One Team</span>
        </div>
      </div>

      <div class="soon__actions">
        <a class="btn-primary" id="linkedinBtn" href="https://www.linkedin.com/company/the-typesetter/" target="_blank" rel="noopener">
          <svg aria-hidden="true" viewBox="0 0 24 24" class="icon"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3V9.5zm7 0h3.8v1.6h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.6 4.8 6V21h-4v-5.2c0-1.2 0-2.9-1.8-2.9s-2 1.4-2 2.8V21h-4V9.5z"/></svg>
          <span>Let’s talk on LinkedIn</span>
        </a>
        <a class="btn-link" id="mailBtn" href="#" hidden>or write to us</a>
        <button class="btn-link" id="replayBtn" type="button">Watch the video again</button>
      </div>
    </div>

    <div class="color-bar" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
